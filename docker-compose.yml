version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: dashboard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dashboard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - dashboard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/dashboard
      JWT_SECRET: ${JWT_SECRET}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_BASE_URL: ${N8N_BASE_URL}
      PORTFOLIO_BASE_URL: ${PORTFOLIO_BASE_URL}
    depends_on:
      - mongodb
    networks:
      - dashboard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dashboard-network

volumes:
  mongodb_data:

networks:
  dashboard-network:
    driver: bridge
